<main class="register-page">
  <!-- Topbar back button -->
  <div class="topbar">
    <a routerLink="/login" aria-label="Volver al inicio de sesión" class="back-btn">
      <mat-icon>arrow_back</mat-icon>
      <span>Volver a iniciar sesión</span>
    </a>
  </div>

  <div class="register-container">
    
    <!-- Brand Header -->
    <div class="register-brand">
      <img class="brand-logo" src="assets/img/logo_cover_1.png" alt="CompanyCare" />
      <div class="brand-info">
        <h1 class="brand-title"><strong>Company</strong>Care</h1>
        <span class="brand-sub">by Senior Advisor</span>
      </div>
    </div>

    <!-- Register Card -->
    <div class="register-card" role="region" aria-label="Crear cuenta">
      <div class="card-header">
        <h2>Crear Cuenta</h2>
        <p>Selecciona tu rol e ingresa tus datos para registrarte.</p>
      </div>

      <!-- Role Selector -->
      <div class="role-selector" role="tablist" aria-label="Tipo de cuenta">
        <button
          type="button"
          class="role-btn"
          [class.active]="role === 'employee'"
          (click)="role = 'employee'"
          role="tab"
          [attr.aria-selected]="role === 'employee'"
        >
          Colaborador / Empleado
        </button>
        <button
          type="button"
          class="role-btn"
          [class.active]="role === 'company_admin'"
          (click)="role = 'company_admin'"
          role="tab"
          [attr.aria-selected]="role === 'company_admin'"
        >
          Administrador Empresa
        </button>
      </div>

      <form class="register-form" (ngSubmit)="submit()">
        
        <!-- Full Name (Employee) -->
        <div class="form-group" *ngIf="role !== 'company_admin'">
          <label for="fullName" class="form-label">Nombre completo</label>
          <div class="input-wrap">
            <mat-icon class="input-icon">person_outline</mat-icon>
            <input
              id="fullName"
              [(ngModel)]="fullName"
              name="fullName"
              type="text"
              autocomplete="name"
              placeholder="Juan Pérez"
              required
            />
          </div>
        </div>

        <!-- Company Name (Company Admin) -->
        <div class="form-group" *ngIf="role === 'company_admin'">
          <label for="companyName" class="form-label">Nombre de la empresa</label>
          <div class="input-wrap">
            <mat-icon class="input-icon">business</mat-icon>
            <input
              id="companyName"
              [(ngModel)]="companyName"
              name="companyName"
              type="text"
              placeholder="Empresa S.A."
              required
            />
          </div>
        </div>

        <!-- Company RUT (Company Admin) -->
        <div class="form-group" *ngIf="role === 'company_admin'">
          <label for="companyRut" class="form-label">RUT Empresa</label>
          <div class="input-wrap">
            <mat-icon class="input-icon">badge</mat-icon>
            <input
              id="companyRut"
              [(ngModel)]="companyRut"
              name="companyRut"
              type="text"
              placeholder="76.123.456-7"
              required
            />
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label">Correo electrónico corporativo</label>
          <div class="input-wrap">
            <mat-icon class="input-icon">mail_outline</mat-icon>
            <input
              id="email"
              [(ngModel)]="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="tu.correo@empresa.com"
              required
            />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-wrap">
            <mat-icon class="input-icon">lock_outline</mat-icon>
            <input
              id="password"
              [(ngModel)]="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="new-password"
              placeholder="Mínimo 6 caracteres"
              required
            />
            <button
              class="toggle-pwd-btn"
              type="button"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              (click)="togglePasswordVisibility()"
            >
              <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
        </div>

        <!-- Messages -->
        <div class="alert alert--error" *ngIf="error">
          <mat-icon>error_outline</mat-icon>
          <span>{{ error }}</span>
        </div>

        <!-- Submit Button -->
        <button class="btn-submit" type="submit" [disabled]="loading" [attr.aria-busy]="loading">
          <span *ngIf="loading" class="spinner" aria-hidden="true"></span>
          <span *ngIf="!loading">Crear mi cuenta</span>
        </button>

        <!-- Login Link Footer -->
        <div class="login-footer">
          <span>¿Ya tienes una cuenta?</span>
          <a class="link-login" routerLink="/login">Inicia sesión</a>
        </div>
      </form>
    </div>

  </div>
</main>
